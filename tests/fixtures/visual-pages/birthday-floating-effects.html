<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>生日蛋糕·浮动装饰验收</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at center, #2e0827 0%, #11031a 70%, #05010a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            overflow-x: hidden;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        h1 {
            font-size: 24px;
            color: #ffb6c1;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.8), 0 0 30px rgba(255, 20, 147, 0.5);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 13px;
            color: #fbcfe8;
            margin-bottom: 25px;
            opacity: 0.9;
        }
        .cake-stage {
            position: relative;
            width: 260px;
            height: 240px;
            margin: 0 auto 30px;
        }
        /* 蛋糕底盘 */
        .plate {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 260px;
            height: 20px;
            background: linear-gradient(to right, #e2e8f0, #ffffff, #cbd5e1);
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 182, 193, 0.4);
        }
        /* 蛋糕第一层 */
        .layer-1 {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 210px;
            height: 70px;
            background: linear-gradient(135deg, #f472b6, #db2777);
            border-radius: 16px 16px 6px 6px;
            box-shadow: inset 0 -6px 0 rgba(0,0,0,0.15), 0 4px 10px rgba(0,0,0,0.3);
        }
        .cream-drops-1 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 16px;
            background: #fff;
            border-radius: 16px 16px 8px 8px;
            box-shadow: 0 4px 8px rgba(255, 105, 180, 0.3);
        }
        /* 蛋糕第二层 */
        .layer-2 {
            position: absolute;
            bottom: 78px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 60px;
            background: linear-gradient(135deg, #fbcfe8, #f472b6);
            border-radius: 14px 14px 6px 6px;
            box-shadow: inset 0 -5px 0 rgba(0,0,0,0.12), 0 4px 10px rgba(0,0,0,0.2);
        }
        .cream-drops-2 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 14px;
            background: #fff;
            border-radius: 14px 14px 8px 8px;
        }
        /* 蛋糕第三层 */
        .layer-3 {
            position: absolute;
            bottom: 134px;
            left: 50%;
            transform: translateX(-50%);
            width: 95px;
            height: 48px;
            background: linear-gradient(135deg, #fdf2f8, #fbcfe8);
            border-radius: 12px 12px 4px 4px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .cream-drops-3 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 12px;
            background: #fff;
            border-radius: 12px 12px 6px 6px;
        }
        /* 数字 21 蜡烛 */
        .candle-box {
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .digit {
            font-size: 26px;
            font-weight: 900;
            color: #fbbf24;
            text-shadow: 0 0 10px #f59e0b, 0 0 20px #d97706;
            position: relative;
            line-height: 1;
        }
        .flame {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 20px;
            background: radial-gradient(ellipse at bottom, #fff 0%, #fef08a 25%, #f59e0b 60%, #ef4444 90%);
            border-radius: 50% 50% 35% 35%;
            box-shadow: 0 0 16px #f59e0b, 0 0 30px #ef4444;
            animation: flicker 0.15s infinite alternate ease-in-out;
            transform-origin: bottom center;
        }
        .flame.extinguished {
            display: none;
        }
        @keyframes flicker {
            0% { transform: translateX(-50%) rotate(-2deg) scale(1); }
            100% { transform: translateX(-50%) rotate(2deg) scale(1.12); }
        }
        /* 爱心与心愿卡 */
        .heart-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 182, 193, 0.35);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            margin-bottom: 20px;
        }
        .heart-card p {
            font-size: 14px;
            line-height: 1.8;
            color: #fed7aa;
            text-align: left;
        }
        .heart-card p span {
            color: #f472b6;
            font-weight: bold;
        }
        .btn-wish {
            background: linear-gradient(135deg, #ec4899, #be185d);
            border: none;
            color: #fff;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(236, 72, 153, 0.5);
            transition: all 0.2s;
        }
        .btn-wish:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 24px rgba(236, 72, 153, 0.7);
        }
        /* 飘落爱心动画 */
        .heart-particle {
            position: fixed;
            pointer-events: none;
            color: #f472b6;
            font-size: 18px;
            animation: floatUp 3.5s linear forwards;
            z-index: 1;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>(⸝⸝>ᴗ<⸝⸝) 生日示例 · 永恒生辰之夜</h1>
        <div class="subtitle">点击蛋糕或底部按钮可以吹灭蜡烛，完成后仍应看到整个场景与提示内容。</div>

        <div class="cake-stage" id="cakeStage" onclick="blowCandle()">
            <div class="candle-box">
                <div class="digit">2<div class="flame" id="flame1"></div></div>
                <div class="digit">1<div class="flame" id="flame2"></div></div>
            </div>
            <div class="layer-3"><div class="cream-drops-3"></div></div>
            <div class="layer-2"><div class="cream-drops-2"></div></div>
            <div class="layer-1"><div class="cream-drops-1"></div></div>
            <div class="plate"></div>
        </div>

        <div class="heart-card">
            <p>
                <span>生日祝福与完整内容说明：</span><br>
                这段说明保留多行文字的排版，用于验证底部内容、交互按钮与动画在大小调整后完整显示。这段说明保留多行文字的排版，用于验证底部内容、交互按钮与动画在大小调整后完整显示。这段说明保留多行文字的排版，用于验证底部内容、交互按钮与动画在大小调整后完整显示。这段说明保留多行文字
            </p>
        </div>

        <button class="btn-wish" id="wishBtn" onclick="blowCandle()">✨ 闭上眼睛·一起吹蜡烛许愿 ✨</button>
        <div id="wishTip" style="margin-top: 15px; font-size: 13px; color: #fbcfe8; display: none;">
            烛光已经熄灭，页面会显示提示并继续播放飘动装饰；底部内容必须完整。
        </div>
    </div>

    <script>
        let blown = false;
        function blowCandle() {
            if (blown) return;
            blown = true;
            document.getElementById('flame1').classList.add('extinguished');
            document.getElementById('flame2').classList.add('extinguished');
            document.getElementById('wishBtn').style.display = 'none';
            document.getElementById('wishTip').style.display = 'block';
            for (let i = 0; i < 40; i++) {
                setTimeout(createHeart, i * 60);
            }
        }

        function createHeart() {
            const h = document.createElement('div');
            h.className = 'heart-particle';
            const hearts = ['♡', '♥', '❀', '✨'];
            h.innerText = hearts[Math.floor(Math.random() * hearts.length)];
            h.style.left = Math.random() * 100 + 'vw';
            h.style.fontSize = (Math.random() * 16 + 14) + 'px';
            h.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
            h.style.color = ['#f472b6', '#fb7185', '#fbcfe8', '#fde047'][Math.floor(Math.random() * 4)];
            document.body.appendChild(h);
            setTimeout(() => h.remove(), 4000);
        }

        setInterval(createHeart, 500);
    </script>
</body>
</html>
